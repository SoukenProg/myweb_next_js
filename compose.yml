version: "3.8"
services:
  app:
    image: node:alpine
    container_name: SoukenWEB
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "12000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "npm run dev"
      sh -c "npm run storybook"
volumes:
  node_modules:
